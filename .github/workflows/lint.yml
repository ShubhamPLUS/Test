name: lint

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::lintr
            any::styler

      - name: Check style (styler)
        run: |
          Rscript -e "
          files <- list.files('R', pattern='\\\\.R$', full.names=TRUE)
          results <- styler::style_files(files, dry='fail')
          if (any(results\$changed)) {
            cat('Style issues found in:\n')
            cat(results\$file[results\$changed], sep='\n')
            quit(status=1)
          }
          message('Style OK')
          "

      - name: Lint (lintr)
        run: |
          Rscript -e "
          lints <- lintr::lint_package(
            linters = lintr::linters_with_defaults(
              lintr::line_length_linter(120L),
              lintr::object_name_linter(styles=c('snake_case','dotted.case')),
              lintr::cyclocomp_linter(complexity_limit=20L)
            )
          )
          if (length(lints) > 0) {
            print(lints)
            quit(status=1)
          }
          message('Lint OK')
          "
