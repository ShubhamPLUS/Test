name: docker-build

on:
  push:
    branches: [main, master]
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_ANALYSIS: ghcr.io/${{ github.repository_owner }}/proteoforge
  IMAGE_SHINY:    ghcr.io/${{ github.repository_owner }}/proteoforge-shiny

jobs:
  build-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (analysis image)
        id: meta-analysis
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_ANALYSIS }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push analysis image
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    docker/Dockerfile
          push:    true
          tags:    ${{ steps.meta-analysis.outputs.tags }}
          labels:  ${{ steps.meta-analysis.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  build-shiny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (shiny image)
        id: meta-shiny
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SHINY }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Shiny image
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    docker/Dockerfile.shiny
          push:    true
          tags:    ${{ steps.meta-shiny.outputs.tags }}
          labels:  ${{ steps.meta-shiny.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
