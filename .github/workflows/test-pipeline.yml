name: test-pipeline

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::devtools

      - name: Install package
        run: Rscript -e "devtools::install('.', dependencies=TRUE, upgrade='never')"

      - name: Run testthat suite
        run: Rscript -e "devtools::test(reporter='progress')"

      - name: Smoke test — generic LFQ pipeline
        run: |
          Rscript - <<'EOF'
          library(proteoforge)
          qf <- system.file("extdata","generic_lfq_small","protein_intensities.tsv",
                            package="proteoforge")
          mf <- system.file("extdata","generic_lfq_small","sample_metadata.tsv",
                            package="proteoforge")
          pfd <- import_generic(qf, mf)
          stopifnot(nrow(pfd@raw_matrix) > 0, ncol(pfd@raw_matrix) > 0)
          pfd <- log2_transform(filter_features(pfd))
          pfd <- normalise_matrix(pfd, method="median")
          qc  <- compute_qc_metrics(pfd)
          stopifnot(!is.null(qc$n_samples))
          message("Smoke test passed: ", nrow(pfd@raw_matrix), " proteins x ",
                  ncol(pfd@raw_matrix), " samples")
          EOF

      - name: Smoke test — phospho pipeline
        run: |
          Rscript - <<'EOF'
          library(proteoforge)
          qf <- system.file("extdata","phospho_lfq_small","phospho_sites.tsv",
                            package="proteoforge")
          mf <- system.file("extdata","phospho_lfq_small","sample_metadata.tsv",
                            package="proteoforge")
          cfg <- list(input=list(analysis_level="phosphosite", quant_type="LFQ"))
          pfd <- import_generic(qf, mf, config=cfg)
          pfd <- filter_phospho_sites(pfd, loc_cutoff=0.75)
          stopifnot(nrow(pfd@raw_matrix) > 0)
          message("Phospho smoke test passed: ", nrow(pfd@raw_matrix), " sites")
          EOF

      - name: Validate AI summary JSON schema
        run: |
          Rscript - <<'EOF'
          library(proteoforge)
          set.seed(1)
          n <- 20L
          sr <- list(A_vs_B = data.table::data.table(
            feature_id=paste0("P",seq_len(n)), log2FC=rnorm(n),
            adj.P.Val=runif(n), significant=runif(n)>0.5,
            direction=sample(c("up","down","ns"),n,replace=TRUE)
          ))
          td   <- tempdir()
          dirs <- list(results_dir=td)
          out  <- write_ai_summary_json(sr, list(n_samples=6L), dirs=dirs)
          j    <- jsonlite::fromJSON(out)
          stopifnot(j$schema_version=="1.0", length(j$contrast_summaries)==1)
          message("AI JSON schema OK")
          EOF
