url: https://proteoforge.github.io/proteoforge

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2c7bb6"
    code-color: "#d63384"

home:
  title: "ProteoForge — Quantitative Proteomics Platform"
  description: >
    A complete R/Bioconductor proteomics analysis platform with support for
    DIA-NN, Spectronaut, FragPipe, MaxQuant, Proteome Discoverer, and Skyline.
    Provides QC, normalisation, imputation, limma-DEqMS, enrichment, networks,
    phosphoproteomics, and reproducible reporting.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/proteoforge/proteoforge

articles:
  - title: "Getting Started"
    navbar: "Getting Started"
    contents:
      - quickstart
  - title: "Data Input"
    navbar: "Data Input"
    contents:
      - input_formats
  - title: "Analysis Methods"
    navbar: "Analysis"
    contents:
      - statistical_methods
      - phospho_workflow
  - title: "Application & Deployment"
    navbar: "App & Deploy"
    contents:
      - shiny_app
      - reproducibility

